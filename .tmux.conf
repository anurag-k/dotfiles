# True color support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# Forward Escape immediately (important for leaving Neovim Insert mode).
set -sg escape-time 0

# Mouse support
set -g mouse on

# Better history
set -g history-limit 10000

# Start windows at 1
set -g base-index 1
set -g pane-base-index 1

# Status refresh
set -g status-interval 5

# Prefix key (keep default initially)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Pane management (all keys follow the Ctrl-a prefix)
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "|" split-window -h -c "#{pane_current_path}"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Repeatable resizing: press Ctrl-a once, then H/J/K/L repeatedly.
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Monochrome slate tmux status
set -g status-style "bg=#161616,fg=#94a3b8"

set -g status-left "#[fg=#cbd5e1,bold] #S #[default]"
set -g status-right "#[fg=#94a3b8]%Y-%m-%d %H:%M"

set -g window-status-current-style "bg=#475569,fg=#f1f5f9,bold"
set -g window-status-style "bg=#161616,fg=#94a3b8"
set -g window-status-current-format " #I:#W#F "
set -g window-status-format " #I:#W#F "

set -g pane-border-style "fg=#334155"
set -g pane-active-border-style "fg=#94a3b8"
set -g message-style "bg=#334155,fg=#f1f5f9"
set -g mode-style "bg=#475569,fg=#f1f5f9"

# Use vi-style keys in copy mode
setw -g mode-keys vi
